services:
  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    networks:
      - books

  client:
    build:
      context: ./client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - books

networks:
  books:
